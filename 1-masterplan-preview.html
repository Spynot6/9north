 const rect=closeup.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight,run=++entranceRun;

 if(entranceVideo.getAttribute('src')!==entrance.src){entranceVideo.preload='auto';entranceVideo.src=entrance.src}
 const start=entranceVideo.play();if(start)start.catch(()=>{if(run!==entranceRun)return;walkPlay.hidden=false;walkCaption.hidden=false;walkCaption.textContent='اضغط للمتابعة إلى المدخل';});

  walkAnimation=walkImage.animate([{transform:`translate(${targetX}px,${targetY}px) scale(${s})`},{transform:`translate(${targetX}px,${targetY}px) scale(${s*1.07})`}],{duration:1600,easing:'ease-out',fill:'forwards'});

function perspectivePose(pos,amount,landing=false){
 const mobile=window.matchMedia('(max-width:850px)').matches;
 const depth=mobile?900:1500,turn=Math.max(-8,Math.min(8,(50-pos[0])*.24))*(mobile?.75:1);

}
const QUALITY_CLOSEUPS={1:'1-clarity-10-building-1-2.webp',2:'1-clarity-10-building-1-2.webp',3:'2-clarity-11-building-3.webp',4:'3-clarity-12-building-4.webp',5:'4-clarity-13-building-5.webp',6:'5-clarity-14-building-6.webp',7:'6-clarity-15-building-7.webp',8:'7-clarity-16-building-8.webp',9:'8-clarity-17-building-9.webp',10:'10-clarity-sunken-plaza.webp'};

if(true){document.querySelectorAll('.zone').forEach(z=>{const show=e=>{if(canvas.classList.contains('is-closeup')||flying){zoneTip.hidden=true;return}const r=scene.getBoundingClientRect();zoneTip.textContent=ZONE_LABELS[z.dataset.zone]||'';if(!zoneTip.textContent){zoneTip.hidden=true;return}zoneTip.style.left=(e.clientX-r.left)+'px';zoneTip.style.top=(e.clientY-r.top)+'px';zoneTip.hidden=false};z.addEventListener('mousemove',show);z.addEventListener('mouseleave',()=>{zoneTip.hidden=true})});}

 n=Number(n);if(!Number.isInteger(n)||n<1||n>10)return;stopEntrance();selectedZone=n;scene.classList.toggle('is-plaza',n===10);zoneTip.hidden=true;

 if(!pre.complete){note.textContent='جاري تجهيز صورة المبنى…';try{await pre.decode()}catch(e){}}

  if(fromMaster){

async function cinematicToMaster(){
 if(flying||selectedZone===null)return;
 stopEntrance();
 if(reducedMotion()){showMasterplan();return}
 const pos=MARKER_POS[selectedZone];
 flying=true;scene.classList.add('is-flying');
 note.textContent='بنرجع للماستر بلان…';
 try{
  const rise=closeup.animate([{transform:perspectivePose(pos,0,true),opacity:1},{transform:perspectivePose(pos,.8,true),opacity:.55}],{duration:220,easing:'ease-in',fill:'forwards'});

 const maxH=sr.height-70,maxW=sr.width-24;let W,H;if(maxW/PLAN_RATIO>maxH){H=maxH;W=H*PLAN_RATIO}else{W=maxW;H=W/PLAN_RATIO}
 return {from:{left:x0+'px',top:y0+'px',width:w0+'px',height:h0+'px'},to:{left:(sr.width-W)/2+'px',top:(sr.height-H)/2+10+'px',width:W+'px',height:H+'px'}}}

<script>
/* Floor split: after the fly-in the building dims and its floors fan out as cards (reel idea, Nov 28). */
const floorsLayer=document.createElement('div');floorsLayer.className='floors-layer';floorsLayer.hidden=true;
const floorsStack=document.createElement('div');floorsStack.className='floors-stack';floorsLayer.appendChild(floorsStack);
const floorsClose=document.createElement('button');floorsClose.type='button';floorsClose.className='floors-close';floorsClose.textContent='رجوع للمبنى ←';floorsClose.hidden=true;floorsLayer.appendChild(floorsClose);
const floorsNote=document.createElement('div');floorsNote.className='floors-note';floorsNote.hidden=true;floorsLayer.appendChild(floorsNote);
scene.appendChild(floorsLayer);
const planInfo=document.createElement('div');planInfo.className='plan-info';planInfo.hidden=true;scene.appendChild(planInfo);
const SPLIT_INFO={commercial:{area:'29',price:'99,000'},hotel:{area:'45',price:'55,000'},office:{area:'48',price:'45,000'}};
let splitOpen=false,splitZone=null,floorsNoteTimer=null;
window.__planFromSplit=false;
function splitFloors(n){const c=FLOOR_CATS[ZONE_CAT[n]];return c?c.floors:[]}
function splitMeta(n){return SPLIT_INFO[ZONE_CAT[n]]||null}
function buildSplit(n){
 floorsStack.innerHTML='';
 splitFloors(n).forEach(f=>{
  const b=document.createElement('button');b.type='button';b.className='fcard';
  const has=!!(FLOOR_PLANS[n]&&FLOOR_PLANS[n][f]);b.setAttribute('aria-disabled',has?'false':'true');
  b.innerHTML='<span class="fdot"></span><span class="fl"></span><span class="fm2"></span>';
  b.querySelector('.fl').textContent=f;
  const m=splitMeta(n);b.querySelector('.fm2').textContent=m?('من '+m.area+' م² · '+m.price+' ج/م²'):'';
  b.setAttribute('aria-label','مبنى '+n+' - الدور '+f+(has?' - المسقط متاح':' - المسقط غير متاح بعد'));
  b.addEventListener('click',e=>{e.stopPropagation();pickFloor(n,f,b,has)});
  floorsStack.appendChild(b);
 });
}
function openSplit(n){
 if(splitOpen||flying||!canvas.classList.contains('is-closeup')||selectedZone!==n||n===10)return;
 if(!splitFloors(n).length)return;
 buildSplit(n);splitOpen=true;splitZone=n;
 scene.classList.add('is-split');floorsLayer.hidden=false;floorsClose.hidden=false;
 note.textContent='المبنى '+n+' · اختار الدور';
 if(!reducedMotion()){
  const cr=closeup.getBoundingClientRect(),sr=scene.getBoundingClientRect();
  const cx=cr.left-sr.left+cr.width/2,cy=cr.top-sr.top+cr.height/2;
  Array.from(floorsStack.children).forEach((b,i)=>{
   const br=b.getBoundingClientRect();
   const dx=cx-(br.left-sr.left+br.width/2),dy=cy-(br.top-sr.top+br.height/2);
   b.animate([{transform:'translate('+dx+'px,'+dy+'px) scale(.35)',opacity:0},{transform:'translate(0px,0px) scale(1)',opacity:1}],{duration:520,delay:60*i,easing:'cubic-bezier(.2,.75,.25,1)',fill:'backwards'});
  });
  floorsClose.animate([{opacity:0},{opacity:1}],{duration:300,delay:250,fill:'backwards'});
 }
}
function closeSplit(){if(!splitOpen)return;splitOpen=false;splitZone=null;scene.classList.remove('is-split');floorsLayer.hidden=true;floorsClose.hidden=true;floorsNote.hidden=true;clearTimeout(floorsNoteTimer);if(selectedZone)note.textContent='المبنى '+selectedZone+' · صورة مقربة · الترقيم مبدئي'}
function toggleSplit(){if(splitOpen)closeSplit();else if(selectedZone&&selectedZone!==10)openSplit(selectedZone)}
function pickFloor(n,f,card,has){
 if(!has){floorsNote.textContent='مسقط الدور ده مش متاح لسه';floorsNote.hidden=false;clearTimeout(floorsNoteTimer);floorsNoteTimer=setTimeout(()=>{floorsNote.hidden=true},2400);return}
 openPlanOverlay(n,f,card);
}
function overlayTarget(){const sr=scene.getBoundingClientRect();const maxH=sr.height-170,maxW=sr.width-24;let W,H;if(maxW/PLAN_RATIO>maxH){H=maxH;W=H*PLAN_RATIO}else{W=maxW;H=W/PLAN_RATIO}
 return {sr:sr,to:{left:(sr.width-W)/2+'px',top:Math.max(50,(sr.height-H)/2-26)+'px',width:W+'px',height:H+'px'}}}
async function openPlanOverlay(n,f,card){
 if(planOpen||planBusy)return;planBusy=true;window.__planFromSplit=true;
 zoneTip.hidden=true;invHover.hidden=true;bmenu.hidden=true;
 planImg.src=PLAN_SRC;planImg.alt='مسقط أفقي - مبنى '+n+' - '+f;
 planInfo.innerHTML='';
 const m=splitMeta(n);
 const t=document.createElement('span');t.textContent='مبنى '+n+' · '+f+(m?' · المساحات من '+m.area+' م² · سعر المتر من '+m.price+' ج':'');planInfo.appendChild(t);
 const q=document.createElement('a');q.href='./?v=5&building='+encodeURIComponent(n);q.textContent='عرض السعر ↗';planInfo.appendChild(q);
 const o=overlayTarget(),cr=card.getBoundingClientRect(),sr=o.sr;
 const from={left:(cr.left-sr.left)+'px',top:(cr.top-sr.top)+'px',width:cr.width+'px',height:cr.height+'px'};
 planVeil.hidden=false;planCard.hidden=false;Object.assign(planCard.style,o.to);
 backPlan.hidden=true;floorsClose.hidden=true;
 planInfo.style.left='50%';planInfo.style.transform='translateX(-50%)';
 planInfo.style.top=(parseFloat(o.to.top)+parseFloat(o.to.height)+12)+'px';
 if(!reducedMotion()){
  const a=planVeil.animate([{opacity:0},{opacity:.72}],{duration:450,fill:'forwards'});
  const c=planCard.animate([Object.assign({opacity:0},from),Object.assign({opacity:1},o.to)],{duration:620,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'});
  const ia=planInfo.animate([{opacity:0},{opacity:1}],{duration:350,delay:260,fill:'backwards'});
  try{await Promise.all([a.finished,c.finished,ia.finished])}catch(e){}
  a.commitStyles();c.commitStyles();a.cancel();c.cancel();ia.cancel();
 }
 planVeil.style.opacity='.72';planCard.style.opacity='1';planInfo.hidden=false;
 planClose.textContent='رجوع للأدوار ←';planClose.hidden=false;planOpen=true;planBusy=false;planClose.focus();
}
async function __closePlanOverlay(){
 if(!planOpen||planBusy)return;planBusy=true;planClose.hidden=true;planInfo.hidden=true;
 if(!reducedMotion()){
  const c=planCard.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.85)'}],{duration:380,easing:'ease-in',fill:'forwards'});
  const a=planVeil.animate([{opacity:.72},{opacity:0}],{duration:380,fill:'forwards'});
  try{await Promise.all([a.finished,c.finished])}catch(e){}
  a.cancel();c.cancel();
 }
 planVeil.hidden=true;planCard.hidden=true;planVeil.style.opacity='0';planCard.style.opacity='0';planCard.style.transform='';
 planClose.textContent='رجوع للماستر بلان ←';planOpen=false;planBusy=false;window.__planFromSplit=false;
 if(canvas.classList.contains('is-closeup'))backPlan.hidden=false;
 if(splitOpen)floorsClose.hidden=false;
}
floorsClose.addEventListener('click',closeSplit);
closeup.addEventListener('click',()=>{if(splitOpen)closeSplit()});
/* leaving the close-up (flight or masterplan) always drops the split first */
const __cinematicToZone=cinematicToZone;
cinematicToZone=function(n){closeSplit();return __cinematicToZone(n)};
const __showMasterplan=showMasterplan;
showMasterplan=function(){closeSplit();__showMasterplan()};
/* auto-split once the close-up image is ready */
window.__afterShowImageReady=function(){
 if(!selectedZone||selectedZone===10||flying||scene.classList.contains('is-playing'))return;
 if(reducedMotion()){openSplit(selectedZone);return}
 setTimeout(()=>{if(selectedZone&&selectedZone!==10&&!flying&&canvas.classList.contains('is-closeup')&&!scene.classList.contains('is-playing')&&!splitOpen)openSplit(selectedZone)},330);
};
/* Escape: plan overlay first, then split; capture so the older handlers don't fire */
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 if(window.__planFromSplit&&planOpen){e.stopPropagation();e.preventDefault();__closePlanOverlay();return}
 if(splitOpen){e.stopPropagation();e.preventDefault();closeSplit()}
},true);
</script></body></html>
