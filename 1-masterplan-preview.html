const diveTransform=(x,y,sc)=>'translate('+(50-x)+'%, '+(50-y)+'%) scale('+sc+')';
function closeupSrc(n){return n<3?'10-building-1-2.webp':(n+8)+'-building-'+n+'.webp'}
function clearSelection(){document.querySelectorAll('[data-zone]').forEach(el=>{el.classList.remove('active');if(el.tagName==='BUTTON')el.setAttribute('aria-pressed','false')})}
function selectZone(n){
 n=Number(n);if(!Number.isInteger(n)||n<1||n>9)return;stopEntrance();selectedZone=n;
 document.querySelectorAll('[data-zone]').forEach(el=>{const selected=el.dataset.zone===String(n);el.classList.toggle('active',selected);if(el.tagName==='BUTTON')el.setAttribute('aria-pressed',String(selected))});
 canvas.classList.add('is-closeup','is-loading');scene.classList.add('is-closeup');closeup.hidden=false;backPlan.hidden=false;closeup.alt='الصورة المقربة للمبنى '+n;
 
 note.textContent='جاري تحميل الصورة المقربة…';
 closeup.src=closeupSrc(n);
 setZoom(fitZoom());centerView();
 if(closeup.complete&&closeup.naturalWidth)showImageReady();
 syncEntrance();
 if(window.matchMedia('(max-width:850px)').matches)scene.scrollIntoView({behavior:'smooth',block:'start'});
}
function preloadEntrance(){const e=ENTRANCES[selectedZone];if(!e||scene.classList.contains('is-playing'))return;if(entranceVideo.getAttribute('src')!==e.src){entranceVideo.preload='auto';entranceVideo.src=e.src;entranceVideo.load()}}
function showImageReady(){if(selectedZone===null||closeup.hidden)return;setZoom(zoom);canvas.classList.remove('is-loading');note.textContent='المبنى '+selectedZone+' · صورة مقربة · الترقيم مبدئي';syncEntrance();preloadEntrance()}
closeup.addEventListener('load',showImageReady);
closeup.addEventListener('error',()=>{canvas.classList.remove('is-loading');note.textContent='الصورة لم تتحمل. اختار رقم المبنى للمحاولة مرة تانية.'});
function showMasterplan(){stopEntrance();selectedZone=null;canvas.classList.remove('is-closeup','is-loading');scene.classList.remove('is-closeup');closeup.hidden=true;backPlan.hidden=true;clearSelection();note.textContent=defaultNote;setZoom(fitZoom());centerView()}
async function cinematicToZone(n){
 n=Number(n);if(!Number.isInteger(n)||n<1||n>9||flying)return;
 if(selectedZone===n&&canvas.classList.contains('is-closeup'))return;
 if(reducedMotion()){selectZone(n);return}
 const fromMaster=!canvas.classList.contains('is-closeup');
 stopEntrance();
 flying=true;scene.classList.add('is-flying');
 const pos=MARKER_POS[n],src=closeupSrc(n);
 const pre=new Image();pre.src=src;
 note.textContent='بننزل من السماء عند المبنى '+n+'…';
 if(fromMaster){
  setZoom(fitZoom());centerView();
  canvas.style.transformOrigin=pos[0]+'% '+pos[1]+'%';
  const dive=canvas.animate([{transform:'translate(0%, 0%) scale(1)'},{transform:diveTransform(pos[0],pos[1],2.7)}],{duration:550,easing:'cubic-bezier(.55,.06,.68,.19)',fill:'forwards'});
  veil.animate([{opacity:0},{opacity:0,offset:.45},{opacity:.92}],{duration:550,easing:'ease-in',fill:'forwards'});
  try{await dive.finished}catch(e){}
  dive.cancel();canvas.style.transformOrigin='';
 }else{
  const vin=veil.animate([{opacity:0},{opacity:.85}],{duration:200,easing:'ease-in',fill:'forwards'});
  try{await vin.finished}catch(e){}
 }
 selectZone(n);
 const landing=closeup.animate([{transform:'scale(1.1)',opacity:.4},{transform:'scale(1)',opacity:1}],{duration:320,easing:'cubic-bezier(.16,.84,.3,1)',fill:'backwards'});
 veil.animate([{opacity:.92},{opacity:0}],{duration:280,easing:'ease-out',fill:'forwards'});
 try{await landing.finished}catch(e){}
 landing.cancel();
 closeup.getAnimations().forEach(animation=>animation.cancel());
 veil.getAnimations().forEach(animation=>animation.cancel());
 flying=false;scene.classList.remove('is-flying');syncEntrance();
}
async function cinematicToMaster(){
 if(flying||selectedZone===null)return;
 stopEntrance();
 if(reducedMotion()){showMasterplan();return}
 flying=true;scene.classList.add('is-flying');
 const pos=MARKER_POS[selectedZone];
 note.textContent='بنرجع للماستر بلان…';
 const rise=closeup.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.14)',opacity:.5}],{duration:300,easing:'cubic-bezier(.5,.05,.75,.4)',fill:'forwards'});
 veil.animate([{opacity:0},{opacity:.9}],{duration:300,easing:'ease-in',fill:'forwards'});
 try{await rise.finished}catch(e){}
 rise.cancel();
 showMasterplan();
 canvas.style.transformOrigin=pos[0]+'% '+pos[1]+'%';
 const ascend=canvas.animate([{transform:diveTransform(pos[0],pos[1],2.3)},{transform:'translate(0%, 0%) scale(1)'}],{duration:550,easing:'cubic-bezier(.22,.61,.36,1)',fill:'backwards'});
 veil.animate([{opacity:.9},{opacity:0}],{duration:500,easing:'ease-out',fill:'forwards'});
 try{await ascend.finished}catch(e){}
 ascend.cancel();
 veil.getAnimations().forEach(animation=>animation.cancel());
 canvas.style.transformOrigin='';
 flying=false;scene.classList.remove('is-flying');
}
backPlan.onclick=cinematicToMaster;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selectedZone){cinematicToMaster();document.querySelector('.zone').focus()}});
document.querySelectorAll('[data-zone]').forEach(el=>{el.addEventListener('click',()=>cinematicToZone(el.dataset.zone));if(el.tagName!=='BUTTON')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cinematicToZone(el.dataset.zone)}})});
function fitZoom(){const h=viewport.clientHeight,w=viewport.clientWidth;if(h<=w)return 1;const ratio=selectedZone&&closeup.naturalWidth?closeup.naturalWidth/closeup.naturalHeight:1600/893;const imgH=Math.min(w,h*ratio)/ratio;return Math.min(3,Math.max(1,h/imgH))}
function centerView(){viewport.scrollTo(Math.max(0,(viewport.scrollWidth-viewport.clientWidth)/2),Math.max(0,(viewport.scrollHeight-viewport.clientHeight)/2))}
function setZoom(z){zoom=Math.max(1,Math.min(3,z));const base=selectedZone&&closeup.naturalWidth?Math.min(viewport.clientWidth,viewport.clientHeight*closeup.naturalWidth/closeup.naturalHeight):viewport.clientWidth;canvas.style.width=(base*zoom)+'px';canvas.style.margin=zoom===1?'auto':'0';viewport.style.alignItems=zoom>1?'flex-start':'center';}
document.getElementById('reset').onclick=()=>{setZoom(1);viewport.scrollTo(0,0)};setZoom(fitZoom());centerView();window.addEventListener('resize',()=>setZoom(zoom));
</script></body></html>
